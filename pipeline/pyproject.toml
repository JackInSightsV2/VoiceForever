[project]
name = "vo"
version = "0.1.0"
description = "VoiceForever offline voice pipeline"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "lupa>=2.8",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.6",
    "transformers>=5",
]

[project.scripts]
vo = "vo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Heavy local-model deps for `vo bakeoff` only: uv run --group bakeoff vo bakeoff
bakeoff = ["mlx-audio[tts]>=0.5.6", "f5-tts-mlx>=0.2.6", "soundfile", "misaki[en]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
